services:
  redis:
    container_name: ${PROJECT_NAME}-redis
    image: redis:8.2
    restart: unless-stopped

    ports:
      - "${RedisSettings__Port}:6379"

    volumes:
      - redis-data:/data

    command:
      - redis-server
      - --requirepass
      - ${RedisSettings__Password}
      - --appendonly
      - "yes"

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "-a",
          "${RedisSettings__Password}",
          "ping"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis-data:
    name: ${PROJECT_NAME}-redis-data
